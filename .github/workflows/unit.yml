name: mfd0816 unit tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - development

jobs:
  build-clang:
   uses: ./.github/workflows/build.yml
   with:
     compiler: clang++
  build-gcc:
    uses: ./.github/workflows/build.yml
    with:
      compiler: g++

  doctest-clang:
    needs: build-clang
    runs-on: ubuntu-24.04
    steps:
    - name: get built tests
      uses: actions/download-artifact@v5
      with:
        name: clang++-build
        path: build/
    - name: run
      run: |
        chmod +x -R build
        cd build
        ctest --output-on-failure
  doctest-gcc:
    needs: build-gcc
    runs-on: ubuntu-24.04
    steps:
    - name: get built tests
      uses: actions/download-artifact@v5
      with:
        name: g++-build
        path: build/
    - name: run
      run: |
        chmod +x -R build
        cd build
        ctest --output-on-failure

  static-checks:
    needs: [doctest-clang, doctest-gcc]
    runs-on: ubuntu-24.04
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: 'true'
    - name: Determine base branch
      id: base
      run: |
        if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
          echo "base=${GITHUB_BASE_REF}" >> "$GITHUB_OUTPUT"
        else
          echo "base=development" >> "$GITHUB_OUTPUT"
        fi
    - uses: ./.github/actions/depend
    - name: get compilation artifacts
      uses: actions/download-artifact@v5
      with:
        name: clang++-build
        path: build/
    - name: run
      run: |
        ln --symbolic "$(which clang-format-20)" /usr/local/bin/clang-format
        ln --symbolic "$(which clang-tidy-20)" /usr/local/bin/clang-tidy
        git fetch origin "${{ steps.base.outputs.base }}:${{ steps.base.outputs.base }}"
        export BASE_BRANCH="${{ steps.base.outputs.base }}"
        echo "===== Running static checks for mfdasm ====="
        ./scripts/static-checks.sh asm
        echo
        echo
        echo "===== Running static checks for mfdemu ====="
        ./scripts/static-checks.sh emu
        echo
        echo
        echo "===== Running static checks for shared ====="
        ./scripts/static-checks.sh shared